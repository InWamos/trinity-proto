services:
  postgres:
    image: postgres:18.1-trixie
    container_name: trinity-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      trinity-net:
        ipv4_address: 172.20.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 3s
      timeout: 5s
      retries: 5
  
  migrate-user:
    image: migrate/migrate:v4.19.1
    container_name: migrate-user
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./internal/user/infrastructure/migrations:/migrations
    command: -path=/migrations -database=postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}?sslmode=disable\&x-migrations-table=schema_migrations_user up
    networks:
      trinity-net:
        ipv4_address: 172.20.0.3

  migrate-record:
    image: migrate/migrate:v4.19.1
    container_name: migrate-record
    depends_on:
      postgres:
        condition: service_healthy
      migrate-user:
        condition: service_completed_successfully
    volumes:
      - ./internal/record/infrastructure/migrations:/migrations
    command: -path=/migrations -database=postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}?sslmode=disable\&x-migrations-table=schema_migrations_record up
    networks:
      trinity-net:
        ipv4_address: 172.20.0.6

  redis:
    image: redis:8.4-bookworm
    container_name: trinity-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --bind 172.20.0.4
    networks:
      trinity-net:
        ipv4_address: 172.20.0.4
    healthcheck:
      test: ["CMD-SHELL", "redis-cli", "-h", "172.20.0.4", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 3
      
  broker:
    image: apache/kafka:3.9.2
    container_name: trinity-broker
    volumes:
      - "kafka_data:/var/lib/kafka/data"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://localhost:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    command: "bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic user-events --partitions 20 --replication-factor 3"
    networks:
      trinity-net:
        ipv4_address: 172.20.0.7
    expose:
      - "9092"
      - "9093"

  trinity:
    build: .
    container_name: trinity-app
    environment:
      DATABASE_ADDRESS: ${DATABASE_ADDRESS}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE}
      REDIS_ADDRESS: ${REDIS_ADDRESS}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB_AUTH: ${REDIS_DB_AUTH}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM}
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD}
      KAFKA_COMPRESSION_TYPE: ${KAFKA_COMPRESSION_TYPE}
      KAFKA_REQUEST_TIMEOUT_MS: ${KAFKA_REQUEST_TIMEOUT_MS}
      LOGGING_LEVEL: ${LOGGING_LEVEL}
      SERVER_ENVIRONMENT: ${SERVER_ENVIRONMENT}
      SERVER_ADDRESS: ${SERVER_ADDRESS}
      SERVER_PORT: ${SERVER_PORT}
      SERVER_TRUSTED_PROXY: ${SERVER_TRUSTED_PROXY}
      SERVER_ALLOWED_ORIGIN: ${SERVER_ALLOWED_ORIGIN}
    ports:
      - "8080:8080"
      - "6060:6060"
    networks:
      trinity-net:
        ipv4_address: 172.20.0.5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate-user:
        condition: service_completed_successfully
      migrate-record:
        condition: service_completed_successfully
      broker:
        condition: service_started

networks:
  trinity-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  redis_data:
  kafka_data: